version: "3.8"

services:

  web:

    build: .

    container_name: scps-web

    ports:

      - "80:80"

    volumes:

      - .:/var/www/html

    depends_on:

      - mysql

  mysql:

    image: mysql:8.0

    container_name: scps-mysql

    restart: always

    environment:

      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: career_placement   

    volumes:

      - mysql_data:/var/lib/mysql

volumes:

  mysql_data: