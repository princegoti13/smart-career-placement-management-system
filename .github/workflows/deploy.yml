name: Deploy To EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Project
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}

          script: |
            cd /var/www/html/career-placement-system

            git reset --hard
            git clean -fd

            git pull origin main

            sudo chown -R www-data:www-data /var/www/html/career-placement-system
            sudo chmod -R 755 /var/www/html/career-placement-system
            sudo chmod -R 777 /var/www/html/career-placement-system/assets/uploads

            sudo systemctl restart apache2